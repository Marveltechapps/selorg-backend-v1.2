name: Deploy Selorg Dashboard Backend (Rollback Safe)

on:
  push:
    branches:
      - main   # ✅ changed to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            set -e
    
            echo "============================="
            echo "🚀 BACKEND DEPLOYMENT STARTED"
            echo "============================="
    
            BACKEND_DIR="/home/ubuntu/selorg/selorg-backend-v1.2"   # ✅ updated path
            DOCKERFILE="/home/ubuntu/selorg/Dockerfiles/Dockerfile-backend"
            ENV_FILE="/home/ubuntu/selorg/envs/backend.env"
            IMAGE_NAME="selorg-backend"
            CONTAINER_NAME="selorg-backend"
            BRANCH="main"   # ✅ changed branch
    
            echo "➡️ Go to backend directory"
            cd $BACKEND_DIR
    
            echo "🧹 Sync repository"
            git fetch origin
            git checkout $BRANCH
            git reset --hard origin/$BRANCH
            git clean -fd
    
            COMMIT=$(git rev-parse --short HEAD)
            NEW_IMAGE="${IMAGE_NAME}:${COMMIT}"
            LATEST_IMAGE="${IMAGE_NAME}:latest"
            BACKUP_IMAGE="${IMAGE_NAME}:backup"
    
            echo "📦 Backup previous image"
            sudo docker image inspect $LATEST_IMAGE >/dev/null 2>&1 && sudo docker tag $LATEST_IMAGE $BACKUP_IMAGE || true
    
            echo "🐳 Build new backend image"
            sudo docker build -t $NEW_IMAGE -f $DOCKERFILE .
    
            echo "🏷 Tag as latest"
            sudo docker tag $NEW_IMAGE $LATEST_IMAGE
    
            echo "🛠 Force production Worldline redirect env on EC2"
            mkdir -p "$(dirname "$ENV_FILE")"
            touch "$ENV_FILE"
            upsert_env() {
              local key="$1"
              local val="$2"
              if grep -qE "^${key}=" "$ENV_FILE"; then
                sed -i -E "s|^${key}=.*|${key}=${val}|" "$ENV_FILE"
              else
                printf '%s=%s\n' "$key" "$val" >> "$ENV_FILE"
              fi
            }
            upsert_env NODE_ENV production
            upsert_env WORLDLINE_WEB_APP_URL https://www.selorg.com
            upsert_env CUSTOMER_WEB_URL https://www.selorg.com
            upsert_env FRONTEND_URL https://www.selorg.com
            echo "Env redirect targets:"
            grep -E '^(NODE_ENV|WORLDLINE_WEB_APP_URL|CUSTOMER_WEB_URL|FRONTEND_URL)=' "$ENV_FILE" || true

            echo "🛑 Stop & remove old container"
            sudo docker stop $CONTAINER_NAME || true
            sudo docker rm $CONTAINER_NAME || true
    
            echo "🚀 Start new backend container"
            sudo docker run -d \
              --name $CONTAINER_NAME \
              --restart always \
              --network selorg-net \
              -p 127.0.0.1:5000:5000 \
              --env-file $ENV_FILE \
              -e NODE_ENV=production \
              -e WORLDLINE_WEB_APP_URL=https://www.selorg.com \
              -e CUSTOMER_WEB_URL=https://www.selorg.com \
              -e FRONTEND_URL=https://www.selorg.com \
              $LATEST_IMAGE
    
            echo "⏳ Waiting for backend boot..."
            sleep 8
    
            echo "🔍 Health check"
            if curl -f http://127.0.0.1:5000/health >/dev/null 2>&1; then
              echo "✅ Deployment successful"
              echo "🔍 Worldline cancel redirect check"
              LOCATION=$(curl -sI https://api.selorg.com/api/v1/customer/payments/worldline/return | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}')
              echo "Location: $LOCATION"
              if echo "$LOCATION" | grep -qi 'localhost'; then
                echo "❌ Cancel redirect still points at localhost"
                exit 1
              fi
            else
              echo "❌ Deployment failed → rollback"
    
              sudo docker logs $CONTAINER_NAME --tail 80 || true
              sudo docker rm -f $CONTAINER_NAME || true
    
              if sudo docker image inspect $BACKUP_IMAGE >/dev/null 2>&1; then
                echo "⏪ Rolling back"
                sudo docker tag $BACKUP_IMAGE $LATEST_IMAGE
                sudo docker run -d \
                  --name $CONTAINER_NAME \
                  --restart always \
                  --network selorg-net \
                  -p 127.0.0.1:5000:5000 \
                  --env-file $ENV_FILE \
                  -e NODE_ENV=production \
                  -e WORLDLINE_WEB_APP_URL=https://www.selorg.com \
                  -e CUSTOMER_WEB_URL=https://www.selorg.com \
                  -e FRONTEND_URL=https://www.selorg.com \
                  $LATEST_IMAGE
                echo "✅ Rollback successful"
              else
                echo "⚠️ No backup image available!"
                exit 1
              fi
            fi
    
            echo "🧹 Cleaning unused images"
            sudo docker image prune -af
    
            echo "============================="
            echo "🎉 BACKEND DEPLOYMENT FINISHED"
            echo "============================="
